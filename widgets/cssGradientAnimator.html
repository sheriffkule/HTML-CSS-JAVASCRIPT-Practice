<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Gradient Animator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" />
    <link rel="stylesheet" href="/widgets_style/cssGradientAnimator.css" />
  </head>
  <body>
    <header>
      <h1>CSS Gradient Animator</h1>
      <p class="subtitle">Create beautiful animated gradients with ease.</p>
    </header>

    <div class="container">
      <div class="app-container">
        <section class="preview-container">
          <article class="gradient-preview" id="gradientPreview">
            <div class="preview-text">Your Gradient Preview</div>
          </article>
        </section>

        <section class="controls-container">
          <article class="control-group">
            <h3><i class="fas fa-palette"></i> Colors</h3>
            <div class="color-pickers">
              <div class="color-picker">
                <label for="color1">Color 1: </label>
                <div class="color-input">
                  <input type="color" id="color1" value="#4361ee" />
                  <input type="text" id="colorText" value="#4361ee" />
                </div>
              </div>
              <div class="color-picker">
                <label for="color1">Color 2: </label>
                <div class="color-input">
                  <input type="color" id="color2" value="#3a0ca3" />
                  <input type="text" id="colorText" value="#3a0ca3" />
                </div>
              </div>
            </div>
          </article>

          <article class="control-group">
            <h3><i class="fas fa-sliders-h"></i> Gradient Settins</h3>
          </article>
        </section>
      </div>
    </div>
  </body>
</html>
