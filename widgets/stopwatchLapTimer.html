<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch & Lap Timer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
    <link rel="stylesheet" href="/widgets_style/stopwatchLapTimer.css" />
  </head>
  <body data-theme="dark">
    <div class="container">
      <header>
        <h1>Stopwatch & Lap Timer</h1>
        <div class="theme-toggle">
          <i class="fas fa-moon"></i>
          <label class="switch">
            <input type="checkbox" id="theme-switch" />
            <span class="slider"></span>
          </label>
          <i class="fas fa-sun"></i>
        </div>
      </header>

      <main>
        <div class="timer-display">
          <span id="hours">00</span>:<span id="minutes">00</span>:<span id="seconds">00</span>,<span
            id="milliseconds"
            >00</span
          >
        </div>

        <div class="controls">
          <button class="btn primary" id="start-stop-btn"><i class="fas fa-play"></i> Start</button>
          <button class="btn secondary" id="lap-btn" disabled><i class="fas fa-flag"></i> Lap</button>
          <button class="btn danger" id="reset-btn"><i class="fas fa-redo"></i> Reset</button>
        </div>

        <div class="stats">
          <div class="stat-card">
            <span class="stat-value" id="fastest-lap">-- : -- : --, --</span>
            <span class="stat-label">Fastest Lap</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="slowest-lap">-- : -- : --, --</span>
            <span class="stat-label">Slowest Lap</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="average-lap">-- : -- : --, --</span>
            <span class="stat-label">Average Lap</span>
          </div>
        </div>

        <div class="laps-container">
          <div class="laps-header">
            <h2>Lap History</h2>
            <button class="btn small" id="export-btn"><i class="fas fa-download"></i> Export CSV</button>
          </div>
          <div class="laps-list" id="laps-list">
            <div class="empty-state">
              <i class="fas fa-flag"></i>
              <p>Your lap times will appear here.</p>
            </div>
          </div>
        </div>
      </main>

      <footer class="footer__copy">
        © <time datetime="" id="year"></time> Made width <span>♥</span> by
        <em><abbr title="Web Developer Frontend Master">SheriffKule</abbr></em> from XXIII century
      </footer>
    </div>

    <script src="/widgets_script/stopwatchLapTimer.js"></script>
  </body>
</html>
