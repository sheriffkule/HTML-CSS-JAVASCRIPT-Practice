<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Library App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <link rel="stylesheet" href="/widgets_style/bookLibrary.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <div class="header-content">
          <div class="logo">
            <i class="fas fa-book-open"></i>
            <span>Book Library App</span>
          </div>
          <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search for books" />
            <button id="searchBtn"><i class="fas fa-search"></i></button>
          </div>
          <div class="user-actions">
            <button class="btn btn-outline" id="addBookBtn"><i class="fas fa-plus"></i> Add Book</button>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="section-title">
        <h2>My Library</h2>
        <span id="bookCount">12 books</span>
      </div>

      <div class="filters">
        <button class="filter active" data-filter="all">All Books</button>
        <button class="filter" data-filter="available">Available</button>
        <button class="filter" data-filter="borrowed">Borrowed</button>
        <button class="filter" data-filter="fiction">Fiction</button>
        <button class="filter" data-filter="non-fiction">Non-Fiction</button>
      </div>

      <div class="books-grid" id="booksContainer">
        <!-- Books will be dynamically added here -->
      </div>
    </main>
  </body>
</html>
