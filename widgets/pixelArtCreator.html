<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Art Creator</title>
    <link rel="stylesheet" href="/widgets_style/pixelArtCreator.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Pixel Art Creator</h1>
        <p class="subtitle">Create your own pixel art masterpiece.</p>
      </header>

      <main class="app-container">
        <section class="tools-panel">
          <h2 class="panel-title">Tools & Colors</h2>

          <article class="tool-section">
            <h3>Current Color</h3>
            <div class="current-color" id="currentColor"></div>
          </article>

          <article class="tool-section">
            <h3>Color Palette</h3>
            <div class="color-palette" id="colorPalette">
              <!-- Colors will be generated by JavaScript -->
            </div>
            <button id="addColorBtn">Add Custom Color</button>
          </article>

          <article class="tool-section">
            <h3>Drawing Tools</h3>
            <div class="tool-buttons">
              <button class="tool-btn active" data-tool="pencil">Pencil</button>
              <button class="tool-btn" data-tool="eraser">Eraser</button>
              <button class="tool-btn" data-tool="fill">Fill</button>
              <button class="tool-btn" data-tool="lighten">Lighten</button>
            </div>
          </article>

          <article class="tool-section">
            <h3>Canvas Size</h3>
            <div class="size-control">
              <label for="canvasSize">Grid Size: <span id="sizeValue">16.16</span></label>
              <input type="range" name="" id="canvasSize" min="8" max="32" value="16" step="8" />
            </div>
            <button id="resizeBtn">Apply Size</button>
          </article>

          <article class="tool-section">
            <h3>Export Options</h3>
            <div class="export-options">
              <button id="saveBtn">Save as Image</button>
              <button class="secondary" id="clearBtn">Clear Canvas</button>
            </div>
          </article>
        </section>

        <section class="canvas-container">
          <h2 class="panel-title">Pixel Canvas</h2>

          <article class="canvas-controls">
            <div class="tool-option">
              <label for="pixelSize">Pixel Size:</label>
              <input type="number" id="pixelSize" min="5" max="50" value="25" />
            </div>
            <button id="applyPixelSize">Apply</button>
          </article>

          <article class="pixel-canvas" id="pixelCanvas">
            <!-- Pixels will be generated by JavaScript -->
          </article>
        </section>
      </main>

      <footer>
        © <time datetime="" id="year"></time> Made width <span>♥</span> by
        <em><abbr title="Web Developer Frontend Master">SheriffKule</abbr></em> from XXIII century
      </footer>
    </div>
  </body>
</html>
