<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Calendar App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
    <link rel="stylesheet" href="/widgets_style/eventCalendarApp.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <h1><i class="fas fa-calendar-alt"></i> Event Calendar App</h1>
        <article class="header-controls">
          <button id="today-btn">Today</button>
          <div class="view-options">
            <button class="view-option active" data-view="day">Day</button>
            <button class="view-option" data-view="week">Week</button>
            <button class="view-option" data-view="month">Month</button>
          </div>
          <div class="date-navigation">
            <button id="prev-btn"><i class="fas fa-chevron-left"></i></button>
            <h2 id="current-date">May 2026</h2>
            <button id="next-btn"><i class="fas fa-chevron-right"></i></button>
          </div>
        </article>
      </header>

      <main class="app-main">
        <section class="calendar-view" id="calendar-view">
          <!-- Calendar content will be generated by JavaScript -->
        </section>

        <aside class="sidebar">
          <article class="sidebar-header">
            <h3>Upcoming Events</h3>
            <button id="add-event-btn"><i class="fas fa-plus"></i> Add Event</button>
          </article>
          <article class="events-list" id="events-list">
            <!-- Events will be populated here -->
          </article>
        </aside>
      </main>
    </div>

    <div class="modal" id="event-modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>Add New Event</h2>
        <form id="event-form">
          <article class="form-group">
            <label for="event-title">Title: <sup>*</sup></label>
            <input type="text" id="event-title" required aria-required="true" />
          </article>
          <article class="form-group">
            <label for="event-date">Date: <sup>*</sup></label>
            <input type="date" id="event-date" required aria-required="true" />
          </article>
          <article class="form-group time-group">
            <div>
              <label for="event-start-time">Start Time: <sup>*</sup></label>
              <input type="time" id="event-start-time" required aria-required="true" />
            </div>
            <div>
              <label for="event-end-time">End Time: <sup>*</sup></label>
              <input type="time" id="event-end-time" required aria-required="true" />
            </div>
          </article>
          <article class="form-group">
            <label for="event-description">Description:</label>
            <textarea id="event-description" rows="3"></textarea>
          </article>
          <article class="form-group">
            <label for="event-color">Color:</label>
            <select id="event-color">
              <option value="#4e73df" aria-selected="true" selected>Blue</option>
              <option value="#1cc88a">Green</option>
              <option value="#f6c23e">Yellow</option>
              <option value="#e74a3b">Red</option>
              <option value="#858796">Gray</option>
              <option value="#5a5c69">Dark</option>
            </select>
          </article>
          <button type="submit" class="save-btn"><i class="fas fa-save"></i> Save Event</button>
        </form>
      </div>
    </div>

    <div class="modal" id="event-details-modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2 id="details-title">Event Title</h2>
        <article class="event-details">
          <p><i class="fas fa-calendar-day"></i> <span id="details-date">Date</span></p>
          <p><i class="fas fa-clock"></i> <span id="details-time">Time</span></p>
          <p><i class="fas fa-align-left"></i> <span id="details-description">Description</span></p>
        </article>
        <article class="event-actions">
          <button id="edit-event-btn"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
          <button id="delete-event-btn"><i class="fas fa-trash-can"></i> Delete</button>
          <button id="close-details-btn"><i class="fa-solid fa-xmark"></i> Close</button>
        </article>
      </div>
    </div>

    <script src="/widgets_script/eventCalendarApp.js"></script>
  </body>
</html>
