<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Style Generator</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
    <link rel="stylesheet" href="/widgets_style/fontStyleGenerator.css" />
  </head>
  <body>
    <div class="app-container">
      <header>
        <h1>Font Style Generator</h1>
        <div class="theme-toggle">
          <span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
        </div>
      </header>

      <main>
        <section class="preview-section">
          <div class="preview-container" id="preview-container">
            <div class="preview-text" id="preview-text">Your Styled Text</div>
          </div>
        </section>

        <section class="controls-section">
          <div class="controls-tabs">
            <button class="tab-btn active" data-tab="text">Text</button>
            <button class="tab-btn" data-tab="effects">Effects</button>
            <button class="tab-btn" data-tab="background">Background</button>
            <button class="tab-btn" data-tab="presets">Presets</button>
          </div>

          <article class="tab-content active" id="text-tab">
            <div class="control-group">
              <label for="text-input">Your Text</label>
              <input type="text" id="text-input" value="Your Styled Text" />
            </div>

            <div class="control-group">
              <label for="font-family">Font Family</label>
              <select id="font-family">
                <option value="Arial, sans-serif">Arial</option>
                <option value="'Helvetica Neue', sans-serif">Helvetica</option>
                <option value="'Times New Roman', serif">Times New Roman</option>
                <option value="Georgia, serif">Georgia</option>
                <option value="'Courier New', monospace">Courier New</option>
                <option value="'Brush Script MT', cursive">Brush Script</option>
                <option value="'Comic Sans MS', cursive">Comic Sans</option>
                <option value="'Roboto', sans-serif">Roboto</option>
                <option value="'Open Sans', sans-serif">Open Sans</option>
                <option value="'Montserrat', sans-serif">Montserrat</option>
              </select>
            </div>

            <div class="control-row">
              <div class="control-group">
                <label for="font-size">Font Size (px):</label>
                <input type="range" id="font-size" min="8" max="120" value="32" />
                <span id="font-size-value">32px</span>
              </div>

              <div class="control-group">
                <label for="font-weight">Font Weight:</label>
                <input type="range" id="font-weight" min="100" max="900" step="100" value="400" />
                <span id="font-weight-value">400</span>
              </div>
            </div>

            <div class="control-row">
              <div class="control-group">
                <label for="line-height">Line Height:</label>
                <input type="range" id="line-height" min="0.8" max="3" step="0.1" value="1.2" />
                <span id="line-height-value">1.2</span>
              </div>

              <div class="control-group">
                <label for="letter-spacing">Letter Spacing (px):</label>
                <input type="range" id="letter-spacing" min="-5" max="20" value="0" step="1" />
                <span id="letter-spacing-value">0px</span>
              </div>
            </div>

            <div class="control-group">
              <label for="text-color">Text Color:</label>
              <input type="color" id="text-color" value="#333333" />
            </div>

            <div class="control-group">
              <label for="text-align">Text Alignment:</label>
              <div class="btn-group" id="text-align">
                <button class="align-btn" value="left" title="Left">
                  <span class="material-symbols-outlined">format_align_left</span>
                </button>
                <button class="align-btn" value="center" title="Center">
                  <span class="material-symbols-outlined">format_align_center</span>
                </button>
                <button class="align-btn" value="right" title="Right">
                  <span class="material-symbols-outlined">format_align_right</span>
                </button>
                <button class="align-btn" value="justify" title="Justify">
                  <span class="material-symbols-outlined">format_align_justify</span>
                </button>
              </div>
            </div>

            <div class="control-group">
              <label for="text-transform">Text Transform</label>
              <select id="text-transform">
                <option value="none">None</option>
                <option value="uppercase">UPPERCASE</option>
                <option value="lowercase">lowercase</option>
                <option value="capitalize">Capitalize</option>
              </select>
            </div>

            <div class="control-group">
              <label for="font-style">Font Style</label>
              <select id="font-style">
                <option value="normal">Normal</option>
                <option value="italic">Italic</option>
                <option value="oblique">Oblique</option>
              </select>
            </div>
          </article>

          <article class="tab-content" id="effects-tab">
            <div class="control-group checkbox-group">
              <input type="checkbox" id="text-shadow-toggle" />
              <label for="text-shadow-toggle">Text Shadow</label>
            </div>

            <div class="control-group shadow-controls" id="shadow-controls">
              <div class="control-row">
                <div class="control-group">
                  <label for="shadow-h">Horizontal (px)</label>
                  <input type="range" id="shadow-h" min="-20" max="20" value="2" step="1" />
                  <span id="shadow-h-value">2px</span>
                </div>

                <div class="control-group">
                  <label for="shadow-v">Vertical (px)</label>
                  <input type="range" id="shadow-v" min="-20" max="20" value="2" step="1" />
                  <span id="shadow-v-value">2px</span>
                </div>
              </div>

              <div class="control-row">
                <div class="control-group">
                  <label for="shadow-blur">Blur (px):</label>
                  <input type="range" id="shadow-blur" min="0" max="20" value="4" step="1" />
                  <span class="shadow-blur-range">4px</span>
                </div>

                <div class="control-group">
                  <label for="shadow-color">Shadow Color:</label>
                  <input type="color" id="shadow-color" value="#000000" />
                </div>
              </div>
            </div>

            <div class="control-group checkbox-group">
              <input type="checkbox" id="text-outline-toggle" />
              <label for="text-outline-toggle">Text Outline</label>
            </div>

            <div class="control-group outline-controls" id="outline-controls">
              <div class="control-row">
                <div class="control-group">
                  <label for="outline-width">Width (px):</label>
                  <input type="range" id="outline-width" min="0" max="10" value="1" step="1" />
                  <span id="outline-width-value">1px</span>
                </div>

                <div class="control-group">
                  <label for="outline-color">Outline Color:</label>
                  <input type="color" id="outline-color" value="#000000" />
                </div>
              </div>
            </div>

            <div class="control-group checkbox-group">
              <input type="checkbox" id="text-gradient-toggle" />
              <label for="text-gradient-toggle">Text Gradient</label>
            </div>

            <div class="control-group gradient-controls" id="gradient-controls">
              <div class="control-group">
                <label for="gradient-type">Gradient Type</label>
                <select id="gradient-type">
                  <option value="linear">Linear</option>
                  <option value="radial">Radial</option>
                </select>
              </div>

              <div class="control-group">
                <label for="gradient-direction">Direction (deg):</label>
                <input type="range" id="gradient-direction" min="0" max="360" value="90" step="1" />
                <span id="gradient-direction-value">90&deg;</span>
              </div>

              <div class="control-group">
                <label>Gradient Colors:</label>
                <div class="gradient-colors" id="gradient-colors">
                  <div class="gradient-color">
                    <input type="color" class="gradient-color-input" value="#ff0000" />
                    <button class="remove-gradient-color">
                      <span class="material-symbols-outlined">close</span>
                    </button>
                  </div>
                  <div class="gradient-color">
                    <input type="color" class="gradient-color-input" value="#0000ff" />
                    <button class="remove-gradient-color">
                      <span class="material-symbols-outlined">close</span>
                    </button>
                  </div>
                </div>
                <button class="btn-security" id="add-gradient-color">
                  <span class="material-symbols-outlined">add</span> Add Color
                </button>
              </div>
            </div>
          </article>

          <article class="tab-content" id="background-tab">
            <div class="control-group">
              <label for="bg-color">Background Color</label>
              <input type="color" id="bg-color" value="#ffffff" />
            </div>

            <div class="control-group checkbox-group">
              <input type="checkbox" id="bg-gradient-toggle" />
              <label for="bg-gradient-toggle">Background Gradient:</label>
            </div>

            <div class="control-group bg-gradient-controls" id="bg-gradient-controls">
              <div class="control-group">
                <label for="bg-gradient-type">Gradient Type:</label>
                <select id="bg-gradient-type">
                  <option value="linear">Linear</option>
                  <option value="radial">Radial</option>
                </select>
              </div>

              <div class="control-group">
                <label for="bg-gradient-direction">Direction (deg):</label>
                <input type="range" id="bg-gradient-direction" min="0" max="360" value="90" />
                <span id="bg-gradient-direction-value">90&deg;</span>
              </div>

              <div class="control-group">
                <label>Gradient Colors:</label>
                <div class="gradient-colors" id="bg-gradient-colors">
                  <div class="gradient-color">
                    <input type="color" class="bg-gradient-color-input" value="#ffffff" />
                    <button class="remove-bg-gradient-color">
                      <span class="material-symbols-outlined">close</span>
                    </button>
                  </div>
                  <div class="gradient-color">
                    <input type="color" class="bg-gradient-color-input" value="#dddddd" />
                    <button class="remove-bg-gradient-color">
                      <span class="material-symbols-outlined">close</span>
                    </button>
                  </div>
                </div>
                <button class="btn-secondary" id="add-bg-gradient-color">
                  <span class="material-symbols-outlined">add</span> Add Color
                </button>
              </div>
            </div>

            <div class="control-group">
              <label for="bg-padding">Padding (px):</label>
              <input type="range" id="bg-padding" min="0" max="100" value="20" />
              <span id="bt-padding-value">20px</span>
            </div>

            <div class="control-group">
              <label for="bg-border-radius">Border Radius (px):</label>
              <input type="range" id="bg-border-radius" min="0" max="50" value="0" />
              <span id="bg-border-radius-value">0px</span>
            </div>

            <div class="control-group checkbox-group">
              <input type="checkbox" id="bg-border-toggle" />
              <label for="bg-border-toggle">Border</label>
            </div>

            <div class="control-group border-controls" id="border-controls">
              <div class="control-row">
                <div class="control-group">
                  <label for="border-width">Width (px):</label>
                  <input type="range" id="border-width" min="0" max="20" value="1" />
                  <span id="border-width-value">1px</span>
                </div>

                <div class="control-group">
                  <label for="border-color">Border Color:</label>
                  <input type="color" id="border-color" value="#000000" />
                </div>
              </div>

              <div class="control-group">
                <label for="border-style">Border Style:</label>
                <select id="border-style">
                  <option value="solid">Solid</option>
                  <option value="dashed">Dashed</option>
                  <option value="dotted">Dotted</option>
                  <option value="double">Double</option>
                  <option value="groove">Groove</option>
                  <option value="ridge">Ridge</option>
                  <option value="inset">Inset</option>
                  <option value="outset">Outset</option>
                </select>
              </div>
            </div>
          </article>

          <article class="tab-content" id="preset-tab">
            <div class="control-group">
              <label for="preset-name">Preset Name:</label>
              <input type="text" id="preset-name" placeholder="Enter preset name" />
            </div>

            <div class="control-group">
              <button class="btn-primary" id="save-preset">
                <span class="material-symbols-outlined">save</span> Save Preset
              </button>
            </div>

            <div class="presets-list" id="presets-list">
              <p>No presets saved yet</p>
            </div>
          </article>
        </section>

        <section class="code-section">
          <div class="code-header">
            <h3>Generated CSS</h3>
            <button class="btn-primary" id="copy-css">
              <span class="material-symbols-outlined">content_copy</span> Copy CSS
            </button>
          </div>
          <pre id="generated-css"><code>/* Your CSS will appear here */</code></pre>
        </section>
      </main>

      <footer class="footer__copy">
        © <time datetime="" id="year"></time> Made width <span>♥</span> by
        <em><abbr title="Web Developer Frontend Master">SheriffKule</abbr></em> from XXIII century
      </footer>
    </div>

    <script src="/widgets_script/fontStyleGenerator.js"></script>
    <script src="ajax.gogleapis.com/ajax/libs/webfont/1.6.26/webfont.js"></script>
  </body>
</html>
