<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Mixer Tool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
    <link rel="stylesheet" href="/widgets_style/colorMixerTool.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1><i class="fas fa-palette"></i> Color Mixer Tool</h1>
        <p>Mix and create beautiful color combinations.</p>
      </header>

      <main class="app-container">
        <section class="color-controls">
          <article class="color-picker-container">
            <fieldset class="color-picker">
              <legend>Color 1</legend>
              <input type="color" id="color1" value="#ff0000" />
              <div class="sliders">
                <div class="slider-group">
                  <label for="r1">R</label>
                  <input type="range" id="r1" min="0" max="255" value="255" />
                  <span id="r1-value">255</span>
                </div>
                <div class="slider-group">
                  <label for="g1">G</label>
                  <input type="range" id="g1" min="0" max="255" value="0" />
                  <span id="g1-value">0</span>
                </div>
                <div class="slider-group">
                  <label for="b1">B</label>
                  <input type="range" id="b1" min="0" max="255" value="0" />
                  <span id="b1-value">0</span>
                </div>
              </div>
            </fieldset>

            <fieldset class="color-picker">
              <legend>Color 2</legend>
              <input type="color" id="color2" value="#0000ff" />
              <div class="sliders">
                <div class="slider-group">
                  <label for="r2">R</label>
                  <input type="range" id="r2" min="0" max="255" value="0" />
                  <span id="r2-value">0</span>
                </div>
                <div class="slider-group">
                  <label for="g2">G</label>
                  <input type="range" id="g2" min="0" max="255" value="0" />
                  <span id="g2-value">0</span>
                </div>
                <div class="slider-group">
                  <label for="b2">B</label>
                  <input type="range" id="b2" min="0" max="255" value="255" />
                  <span id="b2-value">255</span>
                </div>
              </div>
            </fieldset>
          </article>

          <article class="mix-controls">
            <fieldset class="mix-ratio">
              <label for="mixRatio">Mix Ratio: <span id="mixRatioValue">50%</span></label>
              <input type="range" id="mixRatio" min="0" max="100" value="50" />
            </fieldset>

            <fieldset class="mix-method">
              <label for="mixMethod">Mix Method:</label>
              <select id="mixMethod">
                <option value="rgb">RGB Average</option>
                <option value="hsl">HSL Interpolation</option>
                <option value="lab">CIELAB (Perceptual)</option>
              </select>
            </fieldset>

            <button class="btn-primary" id="mixBtn"><i class="fas fa-paint-brush"></i> Mix Colors</button>
          </article>
        </section>

        <section class="results-section">
          <article class="result-color" id="resultColor">
            <div class="color-display"></div>
            <fieldset class="color-info">
              <legend>Mixed Colors</legend>
              <div class="color-values">
                <div>
                  <label for="hexValue">HEX</label>
                  <input type="text" id="hexValue" readonly />
                </div>
                <div>
                  <label for="rgbValue">RGB</label>
                  <input type="text" id="rgbValue" readonly />
                </div>
                <div>
                  <label for="hslValue">HSL</label>
                  <input type="text" id="hslValue" readonly />
                </div>
              </div>
              <button class="btn-secondary" id="copyHex"><i class="far fa-copy"></i> Copy HEX</button>
            </fieldset>
          </article>

          <article class="color-palette">
            <h3>Color Palette</h3>
            <div class="palette-grid" id="paletteGrid">
              <!-- Generated palette will be displayed here -->
            </div>
          </article>
        </section>
      </main>

      <section class="color-history">
        <h3>Recently Mixed Colors</h3>
        <div class="history-grid" id="historyGrid">
          <!-- History items will be displayed here -->
        </div>
      </section>
    </div>

    <footer class="footer__copy">
      © <time datetime="" id="year"></time> Made width <span>♥</span> by
      <em><abbr title="Web Developer Frontend Master">SheriffKule</abbr></em> from XXIII century
    </footer>

    <script src="/widgets_script/colorMixerTool.js"></script>
  </body>
</html>
