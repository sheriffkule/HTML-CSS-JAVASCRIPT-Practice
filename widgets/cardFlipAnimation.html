<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Card Flip Animation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
    <link rel="stylesheet" href="/widgets_style/cardFlipAnimation.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Custom Card Flip Animation</h1>
        <p class="subtitle">Create stunning card flip effects with customizable options.</p>
      </header>

      <main class="app-container">
        <section class="controls-panel">
          <article class="control-group">
            <h3><i class="fas fa-paint-brush"></i> Card Style</h3>
            <fieldset class="btn-group">
              <button class="btn active" data-style="default">Default</button>
              <button class="btn" data-style="minimal">Minimal</button>
              <button class="btn" data-style="gradient">Gradient</button>
              <button class="btn" data-style="neumorphic">Neumorphic</button>
            </fieldset>
          </article>
        </section>
      </main>
    </div>
    <script src="/widgets_script/cardFlipAnimation.js"></script>
  </body>
</html>
