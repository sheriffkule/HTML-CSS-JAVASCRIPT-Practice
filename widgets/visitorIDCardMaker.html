<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visitor ID Card Maker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
    <link rel="stylesheet" href="/widgets_style/visitorIDCardMaker.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Visitor ID Card Maker</h1>
        <p class="subtitle">Create professional visitorID cards in seconds.</p>
      </header>

      <main class="app-container">
        <section class="form-section fade-in">
          <h2>Card Details</h2>

          <article class="template-selector">
            <div class="template template-1 selected" data-template="1">
              <div class="template-header"></div>
              <div class="template-body">
                <div class="template-photo"></div>
              </div>
            </div>
            <div class="template template-2" data-template="2">
              <div class="template-header"></div>
              <div class="template-body">
                <div class="template-photo"></div>
              </div>
            </div>
            <div class="template template-3" data-template="3">
              <div class="template-header"></div>
              <div class="template-body">
                <div class="template-photo"></div>
              </div>
            </div>
            <div class="template template-4" data-template="4">
              <div class="template-header"></div>
              <div class="template-body">
                <div class="template-photo"></div>
              </div>
            </div>
            <div class="template template-5" data-template="5">
              <div class="template-header"></div>
              <div class="template-body">
                <div class="template-photo"></div>
              </div>
            </div>
          </article>

          <article class="form-group">
            <label for="cardTitle">Card Title</label>
            <input type="text" id="cardTitle" placeholder="e.g., Visitor Pass" value="VISITOR PASS" />
          </article>

          <article class="form-group">
            <label for="headerColor">Header Color</label>
            <div class="color-options">
              <div class="color-option selected" style="background-color: #4361ee" data-color="#4361ee"></div>
              <div class="color-option" style="background-color: #3f37c9" data-color="#3f37c9"></div>
              <div class="color-option" style="background-color: #4895ef" data-color="#4895ef"></div>
              <div class="color-option" style="background-color: #4cc9f0" data-color="#4cc9f0"></div>
              <div class="color-option" style="background-color: #f72585" data-color="#f72585"></div>
              <div class="color-option" style="background-color: #7209b7" data-color="#7209b7"></div>
            </div>
          </article>

          <article class="form-group">
            <label for="name">Visitor Name</label>
            <input type="text" id="name" placeholder="John Doe" />
          </article>

          <article class="form-group">
            <label for="company">Company/Organization</label>
            <input type="text" id="company" placeholder="ABC Corporation" />
          </article>

          <article class="form-group">
            <label for="purpose">Purpose of Visit</label>
            <input type="text" id="purpose" placeholder="Meeting, Delivery, etc" />
          </article>

          <article class="form-group">
            <label for="contact">Contact Person</label>
            <input type="text" id="contact" placeholder="Sarah Johnson" />
          </article>

          <article class="form-group">
            <label for="validUntil">Valid Until</label>
            <input type="date" id="validUntil" />
          </article>

          <article class="form-group">
            <label for="photo">Upload Photo</label>
            <input type="file" id="photo" accept="image/*" />
          </article>

          <article class="form-group">
            <label for="logo">Upload Logo (optional)</label>
            <input type="file" id="logo" accept="image/*" />
          </article>

          <article class="form-group">
            <label for="additionalInfo">Additional Information</label>
            <textarea id="additionalInfo" rows="3" placeholder="Any other details to include..."></textarea>
          </article>

          <article class="form-group">
            <label>Include QR Code</label>
            <div>
              <input type="checkbox" id="includeQR" checked />
              <label for="includeQR" style="display: inline; margin-left: 5px">Yes</label>
            </div>
          </article>

          <article class="btn-group">
            <button class="btn btn-block" id="generateBtn">Generate Card</button>
            <button class="btn btn-outline" id="resetBtn">Reset</button>
          </article>
        </section>

        <section class="preview-section fade-in" style="animation-delay: 0.2s">
          <h2>Card Preview</h2>
          <article class="card-container" id="card">
            <div class="card-header">
              <h2 id="cardTitleDisplay">VISITOR PASS</h2>
            </div>
            <div class="card-body">
              <div class="card-photo">
                <div class="photo-placeholder">
                  <i class="fas fa-user"></i>
                </div>
              </div>
              <div class="card-details">
                <p class="name">John Doe</p>
                <p class="company">ABC Corporation</p>
                <p><strong>Purpose:</strong> <span id="purposeDisplay">Meeting</span></p>
                <p><strong>Contact:</strong> <span id="contactDisplay">Sarah Johnson</span></p>
                <p><strong>Valid Until:</strong> <span id="validUntilDisplay">31/12/2026.</span></p>
              </div>
            </div>
            <div class="card-footer">
              <span id="additionalInfoDisplay">Authorized personnel only</span>
              <img src="" alt="Logo" class="card-logo" id="logoDisplay" style="display: none" />
            </div>
            <div class="qr-code" id="qrCodeDisplay">
              <img
                src="https://api.qrserver.com/v1/create-qr-code?size=150x150&data=https://example.com/visitor/123"
                alt="QR Code" />
            </div>
            <div class="signature" id="signatureDisplay">Authorized Sign</div>
          </article>

          <article class="action-buttons">
            <button class="btn" id="downloadBtn"><i class="fas fa-download"></i> Save as Image</button>
            <button class="btn btn-outline" id="saveTemplateBtn">
              <i class="fas fa-save"></i> Save Templates
            </button>
          </article>
        </section>
      </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="/widgets_script/visitorIDCardMaker.js"></script>
  </body>
</html>
