<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom QR Code Maker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
    <link rel="stylesheet" href="/widgets_style/customQrMaker.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <h1><i class="fas fa-qrcode"></i> Custom QR Code Maker</h1>
        <p>Create personalized QR codes with your own style.</p>
      </header>

      <main class="app-main">
        <div class="generator-container">
          <section class="input-section">
            <article class="form-group">
              <label for="qr-content"><i class="fas fa-link"></i> Content to encode</label>
              <input type="text" id="qr-content" placeholder="Enter URL or text..." />
            </article>

            <article class="form-group">
              <label for="qr-size"><i class="fas fa-expand"></i> Size</label>
              <input type="range" id="qr-size" min="100" max="500" value="200" />
              <span id="size-value"></span>
            </article>

            <div class="style-group">
              <article class="form group">
                <label for="qr-color"><i class="fas fa-palette"></i> Color</label>
                <input type="color" id="qr-color" value="#000000" />
              </article>

              <article class="form-group">
                <label for="qr-bgcolor"><i class="fas fa-fill"></i> Background</label>
                <input type="color" id="qr-bgcolor" value="#ffffff" />
              </article>

              <article class="form-group">
                <label for="qr-margin"><i class="fas fa-border-all"></i> Margin</label>
                <input type="range" id="qr-margin" min="0" max="20" value="4" />
                <span id="margin-value">4</span>
              </article>
            </div>

            <article class="form-group">
              <label for="qr-error"><i class="fas fa-shield-alt"></i> Error Correction</label>
              <select id="qr-error">
                <option value="L">Low (7%)</option>
                <option value="M" selected>Medium (15%)</option>
                <option value="Q">Quartile (25%)</option>
                <option value="H">High (30%)</option>
              </select>
            </article>

            <article class="form-group">
              <label for="qr-shape"><i class="fas fa-shapes"></i> Dot Shape</label>
              <select id="qr-shape">
                <option value="square" selected>Square</option>
                <option value="circle">Circle</option>
                <option value="rounded">Rounded</option>
              </select>
            </article>

            <article class="form-group">
              <label for="qr-logo"><i class="fas fa-image"></i> Logo/Image</label>
              <input type="file" id="qr-logo" accept="image/*" />
              <div class="logo-preview-container" id="logo-preview">
                <span>No image selected</span>
              </div>
              <div class="logo-controls">
                <label for="logo-size">Logo Size</label>
                <input type="range" id="logo-size" min="10" max="50" value="30" />
                <span id="logo-size-value">30%</span>
              </div>
            </article>

            <button class="btn-primary" id="generate-btn">
              <i class="fas fa-magic"></i> Generate QR Code
            </button>
          </section>

          <section class="output-section">
            <article class="qr-container" id="qr-code">
              <div class="placeholder">
                <i class="fa fa-qrcode"></i>
                <p>Your QR code will appear here</p>
              </div>
            </article>

            <article class="download-options">
              <button class="btn-secondary" id="download-png"><i class="fas fa-download"></i> PNG</button>
              <button class="btn-secondary" id="download-svg"><i class="fas fa-download"></i> SVG</button>
              <button class="btn-secondary" id="download-jpg"><i class="fas fa-download"></i> JPG</button>
            </article>

            <article class="qr-details">
              <h3><i class="fas fa-info-circle"></i> QR Code Details</h3>
              <div class="detail-item">
                <span>Size:</span>
                <span id="detail-size">--</span>
              </div>
              <div class="detail-item">
                <span>Data Length:</span>
                <span id="detail-length">--</span>
              </div>
              <div class="detail-item">
                <span>Error Correction:</span>
                <span id="detail-error">--</span>
              </div>
            </article>
          </section>
        </div>
      </main>

      <footer class="footer__copy">
        © <time datetime="" id="year"></time> Made width <span>♥</span> by
        <em><abbr title="Web Developer Frontend Master">SheriffKule</abbr></em> from XXIII century
      </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
    <script src="https://unpkg.com/qr-code-styling/lib/qr-code-styling.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-styling@1.6.0-rc.1/lib/qrcode-styling.min.js"></script>
    <script src="/widgets_script/customQrMaker.js"></script>
  </body>
</html>
